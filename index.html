<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小猪跟随 · 手势体验</title>
<style>
:root{color-scheme:dark;--ink:#eef4ff;--muted:#9caec7;--line:#ffffff20;--glass:#101827bb;--cyan:#82f5e7;--violet:#c5a5ff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080e18;color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}
#scene{position:fixed;z-index:0;inset:0;width:100%;height:100%}.backdrop{position:fixed;z-index:-1;inset:0;background:radial-gradient(ellipse at 50% 48%,#182a4070 0%,transparent 55%),linear-gradient(150deg,#0b1220,#090d17 70%);pointer-events:none}
header{position:fixed;z-index:3;top:28px;left:32px;right:32px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px;font-size:13px;letter-spacing:.13em;color:#dce8ff}.logo{width:28px;height:28px;border:1px solid #ffffff36;border-radius:50%;display:grid;place-items:center;color:var(--cyan);font-size:15px}.status{font-size:12px;color:var(--muted);display:flex;gap:9px;align-items:center}.dot{width:7px;height:7px;border-radius:50%;background:#75849a}.dot.live{background:#79edcb;box-shadow:0 0 13px #79edcb}
.center{position:fixed;z-index:2;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none;transition:opacity .5s}.intro{margin-top:-10px}.eyebrow{font-size:11px;letter-spacing:.28em;color:#9aacc4;text-transform:uppercase}.intro h1{font-size:clamp(32px,5vw,58px);font-weight:300;letter-spacing:.08em;margin:18px 0 14px}.intro p{font-size:14px;color:#9aacc4;line-height:1.9;margin:0}.start{pointer-events:auto;margin-top:34px;border:1px solid #ffffff35;background:#dffbf1;color:#12251f;border-radius:999px;padding:14px 25px;font-size:13px;letter-spacing:.06em;cursor:pointer;transition:.2s}.start:hover{transform:translateY(-2px);box-shadow:0 10px 35px #81f5df30}.hint{margin-top:17px;font-size:11px;color:#75849a}.hidden{opacity:0;pointer-events:none}.footer{position:fixed;z-index:2;bottom:25px;left:32px;right:32px;display:flex;justify-content:space-between;color:#7889a1;font-size:11px;letter-spacing:.04em}.pill{border:1px solid var(--line);padding:8px 12px;border-radius:99px;background:#10182788}.error{position:fixed;z-index:5;bottom:66px;left:50%;transform:translateX(-50%);max-width:90%;background:#3b1c28;color:#ffdce3;border:1px solid #ff829755;padding:12px 16px;border-radius:10px;font-size:13px;display:none}.cursor-label{position:fixed;z-index:2;top:50%;left:50%;font-size:10px;letter-spacing:.18em;color:#a5f6e8;opacity:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="scene"></canvas><div class="backdrop"></div>
<header><div class="brand"><div class="logo">✳</div>GESTURE / FIELD</div><div class="status"><i id="dot" class="dot"></i><span id="status">等待开始</span></div></header>
<main class="center" id="intro"><div class="intro"><div class="eyebrow">A small space for your hand</div><h1>让小猪跟着你</h1><p>举起一只手，移动食指。<br>小猪会跟着你的食指，在屏幕里散步。</p><button class="start" id="start">开启摄像头，开始体验</button><div class="hint">摄像头画面仅用于实时识别，不会录制或保存</div></div></main>
<div class="footer"><span class="pill" id="instruction">请将手放入摄像头画面</span><span>移动食指 · 带小猪散步</span></div><div class="error" id="error"></div>
<script type="module">
import {FilesetResolver,HandLandmarker} from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d'),start=document.querySelector('#start'),intro=document.querySelector('#intro'),status=document.querySelector('#status'),dot=document.querySelector('#dot'),error=document.querySelector('#error'),instruction=document.querySelector('#instruction');
let landmarker,stream,video,active=false,point={x:innerWidth/2,y:innerHeight/2},target={...point},seen=false,particles=[],lastTime=0;
function resize(){const dpr=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function fail(message){error.textContent=message;error.style.display='block';status.textContent='无法启动';dot.classList.remove('live')}
start.addEventListener('click',async()=>{start.disabled=true;start.textContent='正在准备…';error.style.display='none';try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640,height:480},audio:false});video=document.createElement('video');video.srcObject=stream;video.playsInline=true;await video.play();const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');landmarker=await HandLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:'GPU'},runningMode:'VIDEO',numHands:1});active=true;intro.classList.add('hidden');status.textContent='正在追踪';dot.classList.add('live');instruction.textContent='已找到手势时，移动食指来引导光点';requestAnimationFrame(loop)}catch(e){console.error(e);let msg=e.name==='NotAllowedError'?'请允许浏览器使用摄像头，然后重新尝试。':e.name==='NotFoundError'?'没有找到可用摄像头。':'启动失败，请确认网络可用，并使用 localhost 或 HTTPS 打开页面。';fail(msg);start.disabled=false;start.textContent='再试一次'}});
function loop(t){if(!active)return;if(video.readyState>=2&&landmarker&&t-lastTime>30){lastTime=t;const result=landmarker.detectForVideo(video,t);if(result.landmarks?.length){const p=result.landmarks[0][8];target.x=(1-p.x)*innerWidth;target.y=p.y*innerHeight;if(!seen){point={...target};seen=true;instruction.textContent='手势已识别 · 移动食指来引导光点'}}else{seen=false;instruction.textContent='请将手放入摄像头画面'}}point.x+=(target.x-point.x)*.24;point.y+=(target.y-point.y)*.24;draw(t);requestAnimationFrame(loop)}
function draw(t){ctx.clearRect(0,0,innerWidth,innerHeight);if(seen){particles.push({x:point.x,y:point.y,life:1,size:2+Math.random()*3});if(particles.length>70)particles.shift()}particles=particles.filter(p=>p.life>.03);for(const p of particles){p.life*=.955;ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);ctx.fillStyle=`rgba(130,245,231,${p.life*.38})`;ctx.fill()}if(!seen){ctx.save();ctx.globalAlpha=.34;ctx.fillStyle='#d5e1f2';ctx.font='13px Inter, sans-serif';ctx.textAlign='center';ctx.fillText('✦',innerWidth/2,innerHeight/2);ctx.restore();return}const pulse=1+Math.sin(t*.004)*.08;const g=ctx.createRadialGradient(point.x,point.y,0,point.x,point.y,78*pulse);g.addColorStop(0,'#b8fff0aa');g.addColorStop(.16,'#82f5e755');g.addColorStop(1,'#82f5e700');ctx.fillStyle=g;ctx.beginPath();ctx.arc(point.x,point.y,78*pulse,0,Math.PI*2);ctx.fill();ctx.save();ctx.translate(point.x,point.y);ctx.scale(pulse,pulse);ctx.shadowColor='#ff8fb6';ctx.shadowBlur=22;ctx.fillStyle='#f7a9c2';ctx.strokeStyle='#ffe1eb';ctx.lineWidth=2;ctx.lineJoin='round';ctx.beginPath();ctx.ellipse(0,2,25,20,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.beginPath();ctx.ellipse(-13,-13,7,11,-.55,0,Math.PI*2);ctx.ellipse(13,-13,7,11,.55,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#f28eae';ctx.beginPath();ctx.ellipse(0,6,10,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#7e4057';ctx.beginPath();ctx.ellipse(-3,6,1.4,2.2,0,0,Math.PI*2);ctx.ellipse(3,6,1.4,2.2,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#633d4e';ctx.beginPath();ctx.arc(-9,-1,1.7,0,Math.PI*2);ctx.arc(9,-1,1.7,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#a75573';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,8,3,Math.PI*.15,Math.PI*.85);ctx.stroke();ctx.restore()}
addEventListener('beforeunload',()=>stream?.getTracks().forEach(t=>t.stop()));
</script>
</body></html>
